name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.3.11)'
        required: true
        default: 'v0.3.11'

jobs:
  build:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          OUTPUT=$(python -m unittest test_core.py test_runtime.py -v 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            echo "$OUTPUT" > test_failure_log.txt
            git add test_failure_log.txt
            git commit -m "ci: test failure log"
            git push -f origin HEAD:test-log
          fi
          exit $EXIT_CODE

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm AutoClicker.spec

      - name: Verify executable layout
        shell: pwsh
        run: |
          if (!(Test-Path "dist/AutoClicker.exe")) {
            throw "Executable dist/AutoClicker.exe was not created."
          }

      - name: Determine Release Tag
        id: get_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload Binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: ${{ steps.get_tag.outputs.tag }}
          files: dist/AutoClicker.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



